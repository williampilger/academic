<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cadastro de Funcionário — EducaLar</title>
		<!-- Tailwind CDN (arquivo único, protótipo) -->
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			/* Pequenas customizações para o protótipo */
			.glass {
				background: rgba(255,255,255,0.6);
				backdrop-filter: blur(6px);
			}
		</style>
	</head>
	<body class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-amber-50 text-gray-800">
		<header class="bg-white/60 backdrop-blur sticky top-0 z-10 shadow-sm">
			<div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
				<div class="flex items-center gap-3">
					<div class="w-10 h-10 rounded-md bg-rose-500 flex items-center justify-center text-white font-bold">EL</div>
					<div>
						<h1 class="text-lg font-semibold">EducaLar</h1>
						<p class="text-xs text-gray-500">Painel do Administrador</p>
					</div>
				</div>
				<nav class="flex gap-2 items-center">
					<a class="text-sm text-rose-600 hover:underline" href="#">Voltar</a>
					<button class="px-3 py-1 rounded-md bg-rose-600 text-white text-sm">Sair</button>
				</nav>
			</div>
		</header>

		<main class="max-w-5xl mx-auto px-4 py-10">
			<div class="grid grid-cols-3 gap-8">
				<!-- Card do formulário -->
				<section class="col-span-2">
					<div class="glass rounded-xl p-6 shadow-md">
						<div class="flex items-center justify-between mb-4">
							<h2 class="text-xl font-semibold">Cadastro de funcionário</h2>
							<span class="text-sm text-gray-500">Campos com * são obrigatórios</span>
						</div>

						<form id="form-cadastro" class="space-y-4">
							<div class="grid grid-cols-2 gap-4">
								<div>
									<label class="block text-sm font-medium text-gray-700">Nome completo *</label>
									<input type="text" name="nome" required class="mt-1 block w-full rounded-md border-gray-200 shadow-sm focus:ring-2 focus:ring-rose-200 focus:border-rose-400" placeholder="Maria Silva" />
								</div>
							</div>

							<div class="grid grid-cols-3 gap-4">
								<div>
									<label class="block text-sm font-medium text-gray-700">E-mail *</label>
									<input type="email" name="email" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm focus:ring-2 focus:ring-rose-200" placeholder="exemplo@empresa.com" />
								</div>
								<div>
									<label class="block text-sm font-medium text-gray-700">Telefone *</label>
									<input type="tel" name="telefone" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm focus:ring-2 focus:ring-rose-200" placeholder="(51) 9 9999-9999" />
								</div>
							</div>

							<div class="grid grid-cols-2 gap-4">
								<div>
									<label class="block text-sm font-medium text-gray-700">Status</label>
									<select name="status" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm focus:ring-2 focus:ring-rose-200">
										<option>Ativo</option>
										<option>Em licença</option>
										<option>Desligado</option>
									</select>
								</div>
							</div>

							<div class="flex items-center gap-3 justify-end pt-2">
								<!-- <button type="button" class="px-4 py-2 rounded-md border border-gray-200 bg-white text-sm hover:bg-gray-50" onclick="document.getElementById('form-cadastro').reset()">Limpar</button> -->
								<button type="submit" class="px-4 py-2 rounded-md bg-rose-600 text-white text-sm hover:bg-rose-700">Salvar</button>
							</div>
						</form>
					</div>
				</section>

				<!-- Painel lateral com informações rápidas -->
				<aside class="space-y-4">
					<!-- <div class="glass rounded-xl p-4 shadow-sm">
						<h3 class="font-semibold">Resumo rápido</h3>
						<ul class="mt-2 text-sm text-gray-600 space-y-1">
							<li>• Funcionários cadastrados: <strong>12</strong></li>
							<li>• Último cadastro: <strong>2 dias atrás</strong></li>
							<li>• Função mais comum: <strong>Garçom</strong></li>
						</ul>
					</div> -->

					<div class="glass rounded-xl p-4 shadow-sm">
						<h3 class="font-semibold">Ações</h3>
						<div class="mt-3 flex flex-col gap-2">
							<button class="w-full text-left px-3 py-2 rounded-md border border-gray-200 text-sm hover:bg-gray-50">Redefinir Senha</button>
						</div>
					</div>
				</aside>
			</div>
		</main>

		<footer class="mt-10 py-6">
			<div class="max-w-5xl mx-auto px-4 text-center text-sm text-gray-500">
				Painel Administrativo. — Happy Dinner © 2025
			</div>
		</footer>

		<script>
			// Handler simples de submissão (protótipo)
			document.getElementById('form-cadastro').addEventListener('submit', function(e){
				e.preventDefault();
				const nome = this.nome.value || '(sem nome)';
				// Simular sucesso
				alert('Funcionário "' + nome + '" salvo com sucesso (protótipo).');
				this.reset();
			});
		</script>
	</body>
</html>
